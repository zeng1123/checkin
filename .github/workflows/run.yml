name: run

on:
  workflow_dispatch:
  push:
  schedule:
    - cron: "0 1 * * *" # UTC 01:00 = 北京时间 09:00

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm test
      - run: npm run main
        env:
          GLADOS: ${{ secrets.GLADOS }}
          GLADOS_UA: ${{ secrets.GLADOS_UA }}
          GLADOS_DOMAIN: ${{ vars.GLADOS_DOMAIN }}
          NOTIFY: ${{ secrets.NOTIFY }}
